services:
  # Data Warehouse / Metadata DB
  postgres_dwh:
    image: postgres:15
    container_name: kooll_postgres_dwh
    environment:
      POSTGRES_USER: admin_kooll
      POSTGRES_PASSWORD: super_password_123
      POSTGRES_DB: kooll_dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_kooll -d kooll_dwh"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interfaz Gráfica para gestionar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: kooll_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kooll.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_dwh
    restart: always

volumes:
  postgres_data:
